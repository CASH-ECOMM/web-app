name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cash-ui
          file: ./cash-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/cash-ecomm/web-app:latest
            ghcr.io/cash-ecomm/web-app:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://router-service-production.up.railway.app/api
            VITE_AI_API_URL=https://ai-agent-production-b7fd.up.railway.app/api

  build-and-push-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Local Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cash-ui
          file: ./cash-ui/Dockerfile
          push: true
          tags: ghcr.io/cash-ecomm/web-app:local
          build-args: |
            VITE_API_URL=http://localhost:8080/api
            VITE_AI_API_URL=http://localhost:8000/api
